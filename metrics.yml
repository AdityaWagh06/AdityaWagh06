name: Update Contribution Calendar

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch:        # lets you trigger it manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: AdityaWagh06
          filename: profile-metrics/contribution-calendar.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 365
          config_timezone: Asia/Kolkata
          config_display: large
          config_theme: github-dark
